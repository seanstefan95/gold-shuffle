name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Add the KEYSTORE_B64 and KEYSTORE_PASSWORD secrets (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleRelease
      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk GoldShuffle-${{ github.run_number }}.apk
      - name: Build the friend kit zip
        run: |
          N=${{ github.run_number }}
          K="GoldShuffle-$N"
          mkdir -p "$K/Android" "$K/PC"
          cp GoldShuffle-$N.apk "$K/Android/"
          cp pc/goldShuffle.js kit/install-gold-shuffle.ps1 "$K/PC/"
          cp docs/Gold-Shuffle-setup-guide.pdf kit/START-HERE.txt kit/Spotify-dashboard-values.txt "$K/"
          cp LICENSE "$K/LICENSE.txt"; cp NOTICE "$K/NOTICE.txt"
          zip -r -q "GoldShuffle-$N-kit.zip" "$K"
      - uses: actions/upload-artifact@v4
        with:
          name: GoldShuffle-${{ github.run_number }}
          path: GoldShuffle-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Gold Shuffle build ${{ github.run_number }}
          files: |
            GoldShuffle-${{ github.run_number }}-kit.zip
            GoldShuffle-${{ github.run_number }}.apk
            pc/goldShuffle.js
          body: |
            **Everything in one download:** `GoldShuffle-${{ github.run_number }}-kit.zip` (app, PC add-on, setup guide). Open `START-HERE.txt` first.
            **Android:** install `GoldShuffle-${{ github.run_number }}.apk` on your phone.
            **PC:** put `goldShuffle.js` in Spicetify's Extensions folder, then run `spicetify apply`.
            Setup steps are in the README.
